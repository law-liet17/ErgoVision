# Render blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New → Blueprint → connect this repo. It reads this file, builds the
# Dockerfile and deploys. No build command or start command to type in.
#
# Free plan notes:
#   * the service sleeps after 15 minutes idle; the first request then takes
#     ~30 s to wake, and pose detection adds a few seconds on top
#   * free services get no persistent disk, so the SQLite register resets on
#     every deploy and every sleep. Load the demo data from the dashboard, or
#     move to Starter and uncomment the disk block below to keep real records.

services:
  - type: web
    name: ergovision
    runtime: docker
    plan: free
    region: singapore          # closest to Sri Lanka; oregon / frankfurt also fine
    branch: main
    healthCheckPath: /health
    autoDeploy: true          # rebuild on every push to main
    envVars:
      - key: ERGOVISION_MODEL_COMPLEXITY
        value: "1"             # 0 fastest, 2 most accurate and slowest
      - key: ERGOVISION_DB
        value: /data/ergovision.db
      - key: PYTHON_VERSION
        value: "3.12"

    # Keep the risk register between deploys (needs a paid plan):
    # disk:
    #   name: ergovision-data
    #   mountPath: /data
    #   sizeGB: 1
